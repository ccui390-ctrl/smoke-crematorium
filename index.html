<title>烟锁殡仪馆 · 一桩没有干净人的案子</title>
<style>
/* ============ 烟锁殡仪馆 · 样式 ============ */
:root{
  --ink:#060708;
  --ink2:#0b0d0e;
  --paper:#e8e0d2;
  --paper-2:#ded5c6;
  --dim:#8f887c;
  --dim2:#5f5a52;
  --red:#b13b2c;
  --red2:#e0573f;
  --line:rgba(232,224,210,.13);
  --line2:rgba(232,224,210,.07);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","Source Han Serif CN",SimSun,"STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --k:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;background:#060708;}body{height:100%;}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--serif);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;}
::selection{background:rgba(177,59,44,.4);}

/* ---------- 全局质感层 ---------- */
#grain{
  position:fixed;inset:-60%;z-index:60;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMjAnIGhlaWdodD0nMjIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMycgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPScyMjAnIGhlaWdodD0nMjIwJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=");
  animation:grainShift .7s steps(3) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0)}
  33%{transform:translate(-2%,1%)}
  66%{transform:translate(1%,-2%)}
  100%{transform:translate(0,0)}
}
#vignette{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 44%,
    rgba(0,0,0,0) 26%,
    rgba(0,0,0,.35) 62%,
    rgba(0,0,0,.72) 86%,
    rgba(0,0,0,.92) 100%);
  opacity:.35;transition:opacity 1.6s ease;
}
body[data-san="1"] #vignette{opacity:.52}
body[data-san="2"] #vignette{opacity:.62}
body[data-san="3"] #vignette{opacity:.72}
body[data-san="4"] #vignette{opacity:.82}
body[data-san="5"] #vignette{opacity:.92}
body[data-san="4"] #vignette,body[data-san="5"] #vignette{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.04);opacity:.92}
}
#flash{position:fixed;inset:0;z-index:75;pointer-events:none;background:#fff;opacity:0;}
#flash.hit{animation:flashHit .5s steps(2) forwards}
@keyframes flashHit{0%{opacity:.96}40%{opacity:0}55%{opacity:.85}100%{opacity:0}}
#fade{position:fixed;inset:0;z-index:65;pointer-events:none;background:#030404;opacity:0;transition:opacity .55s ease;}
#fade.on{opacity:1}

/* ---------- 布局 ---------- */
#app{display:flex;flex-direction:column;height:100dvh;}
#top{
  height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;border-bottom:1px solid var(--line2);
  font-family:var(--sans);font-size:11px;letter-spacing:.22em;color:var(--dim);
  background:#070909;
  position:relative;z-index:30;
}
#top .left{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 auto;overflow:hidden;}
#top .left .no{color:var(--red2);letter-spacing:.28em;}
#top .left .scene{color:var(--paper);opacity:.85;letter-spacing:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#top .right{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.tbtn{
  background:none;border:1px solid transparent;color:var(--dim);
  font-family:var(--sans);font-size:11px;letter-spacing:.2em;
  padding:7px 10px;cursor:pointer;transition:.25s;position:relative;
}
.tbtn:hover{color:var(--paper);border-color:var(--line);}
.tbtn .badge{
  display:inline-block;min-width:15px;height:15px;line-height:15px;margin-left:6px;
  padding:0 3px;border-radius:8px;background:rgba(177,59,44,.85);color:#fff;
  font-size:9px;letter-spacing:0;text-align:center;
}
.tbtn svg{vertical-align:-2px}

#stage{position:relative;flex:1 1 auto;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#0d1110,#050606 72%);}
#stage:before{
  content:'';position:absolute;inset:0;z-index:0;
  background:
    
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
}
#stage:after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 150px 46px rgba(3,4,4,.92),inset 0 0 40px 0 rgba(0,0,0,.6);
}
#bleed{ display:none; position:absolute;inset:-8%;z-index:0;pointer-events:none;opacity:.5;
  filter:blur(30px) saturate(.85) brightness(.5);
  transform:scale(1.06);
}
#bleed svg{width:100%;height:100%;display:block}
#world{
  position:absolute;left:0;top:0;width:1200px;height:750px;z-index:1;
  transform-origin:0 0;background:#050606;
  box-shadow:0 0 120px rgba(0,0,0,.9);
}
#art{position:absolute;inset:0;}
#art svg{display:block;width:100%;height:100%;}
#spots,#nav,#chips{position:absolute;inset:0;pointer-events:none;}
#spots>*,#nav>*,#chips>*{pointer-events:auto;}

/* ---------- 热点 ---------- */
.hs{
  position:absolute;transform:translate(-50%,-50%);
  background:none;border:0;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  color:var(--paper);
}
.hs i{
  display:block;width:13px;height:13px;border-radius:50%;
  border:1px solid rgba(232,224,210,.55);
  box-shadow:0 0 0 7px rgba(232,224,210,.05),0 0 16px rgba(0,0,0,.9);
  transition:.35s;position:relative;
}
.hs i:after{
  content:'';position:absolute;inset:-9px;border-radius:50%;
  border:1px solid rgba(232,224,210,.16);
  animation:pulse 3.4s ease-out infinite;
}
@keyframes pulse{
  0%{transform:scale(.6);opacity:.9}
  70%{transform:scale(1.5);opacity:0}
  100%{transform:scale(1.5);opacity:0}
}
.hs b{
  font:400 10.5px/1 var(--sans);letter-spacing:.14em;font-weight:400;
  color:rgba(232,224,210,.78);text-shadow:0 2px 10px #000,0 0 3px #000;
  white-space:nowrap;transition:.3s;
  background:rgba(3,5,5,.52);padding:3px 7px 2px;border:1px solid rgba(232,224,210,.08);
  backdrop-filter:blur(1px);
}
.hs:hover i,.hs:focus-visible i{
  border-color:var(--red2);
  box-shadow:0 0 0 9px rgba(224,87,63,.09),0 0 26px rgba(224,87,63,.55);
}
.hs:hover b,.hs:focus-visible b{color:#fff;letter-spacing:.22em;}
.hs.up{flex-direction:column-reverse;}
.hs.done i{border-color:rgba(232,224,210,.2);box-shadow:0 0 0 6px rgba(232,224,210,.03);}
.hs.done i:after{display:none}
.hs.done b{color:rgba(232,224,210,.32);}
.hs.node i{width:78px;height:78px;border-width:1px;background:rgba(6,8,8,.72);}
.hs.node b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.12em;color:rgba(232,224,210,.8);}
.hs.node:hover i{border-color:var(--red2);background:rgba(177,59,44,.14);}
.hs.node.lit i{border-color:rgba(224,87,63,.9);background:rgba(177,59,44,.22);box-shadow:0 0 40px rgba(224,87,63,.4);}
.hs.node.lit b{color:#fff}

/* ---------- 场景导航 ---------- */
#nav{display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;padding:0 26px 22px;flex-direction:row;}
#nav .navbtn{
  background:rgba(6,8,8,.66);border:1px solid var(--line);
  color:var(--paper-2);font-family:var(--sans);font-size:12px;letter-spacing:.2em;
  padding:11px 18px;cursor:pointer;transition:.3s;backdrop-filter:blur(6px);
}
#nav .navbtn:hover{border-color:rgba(224,87,63,.6);color:#fff;background:rgba(177,59,44,.12);}
#nav .navbtn.primary{border-color:rgba(177,59,44,.55);color:#f0d9d2;}
#nav .navbtn.primary:hover{background:rgba(177,59,44,.24)}

/* ---------- 紧凑模式热点列表 ---------- */
#chips{display:none;align-items:flex-start;align-content:flex-start;flex-wrap:wrap;gap:8px;padding:14px;top:auto;bottom:0;height:auto;}
#chips .chip{
  background:rgba(6,8,8,.72);border:1px solid var(--line);color:var(--paper-2);
  font-family:var(--sans);font-size:12px;letter-spacing:.14em;padding:8px 12px;cursor:pointer;
}
#chips .chip.done{color:var(--dim2);border-color:var(--line2);}
#chips .chip:hover{border-color:rgba(224,87,63,.6);color:#fff}

/* ---------- 对话框 ---------- */
#dialog{
  position:relative;z-index:20;flex:0 0 auto;
  min-height:clamp(138px,19vh,196px);
  padding:18px clamp(24px,7vw,110px) 22px;
  border-top:1px solid var(--line);
  background:
    linear-gradient(180deg,rgba(9,11,11,.86),rgba(4,5,6,.99) 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px);
  box-shadow:0 -30px 80px rgba(0,0,0,.6);
}
#dialog:before{
  content:'';position:absolute;left:0;top:0;width:2px;height:100%;
  background:linear-gradient(180deg,transparent,var(--red),transparent);opacity:.55;
}
#who{
  font-family:var(--sans);font-size:11px;letter-spacing:.3em;color:var(--red2);
  min-height:16px;margin-bottom:10px;
}
#txt{
  font-size:clamp(15px,1.45vw,18.5px);line-height:2.05;letter-spacing:.03em;
  color:#ddd4c6;max-width:980px;min-height:2em;white-space:pre-wrap;
}
#txt .dim{color:var(--dim);font-size:.9em;letter-spacing:.06em;}
#hint{
  position:absolute;right:26px;bottom:16px;
  font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:#8f8676;
  opacity:0;transition:.4s;
}
#hint.on{opacity:1;animation:blink 2.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.28}50%{opacity:.85}}
#choices{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:660px;}
.choice{
  text-align:left;background:rgba(255,255,255,.015);border:1px solid var(--line);
  color:var(--paper-2);font-family:var(--serif);font-size:15px;letter-spacing:.04em;
  padding:12px 18px;cursor:pointer;transition:.28s;line-height:1.6;
}
.choice:hover{border-color:rgba(224,87,63,.65);background:rgba(177,59,44,.1);padding-left:26px;color:#fff;}
.choice .idx{font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--red2);margin-right:10px;}

/* ---------- 提示 toast ---------- */
#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:72;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  font-family:var(--sans);font-size:12px;letter-spacing:.18em;
  padding:9px 18px;color:#f2e8dd;
  background:rgba(8,10,10,.9);border:1px solid rgba(177,59,44,.5);
  border-left:2px solid var(--red2);
  box-shadow:0 10px 40px rgba(0,0,0,.7);
  animation:toastIn .5s ease both;
}
.toast.out{animation:toastOut .5s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- 章节卡 ---------- */
#card{
  position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;padding:8vw 8vh;
  background:radial-gradient(ellipse at 50% 50%,#0a0b0b,#030404 70%);
  opacity:0;pointer-events:none;transition:opacity .9s ease;
}
#card.on{opacity:1;pointer-events:auto}
#card .kicker{font-family:var(--sans);font-size:11px;letter-spacing:.5em;color:var(--red2);margin-bottom:28px;}
#card .line{
  margin:9px 0;font-size:clamp(16px,2vw,23px);line-height:1.95;letter-spacing:.06em;
  color:#d9d0c2;text-align:center;opacity:0;transform:translateY(9px);
  animation:lineIn 1.1s cubic-bezier(.2,.8,.2,1) forwards;
}
#card .line.gray{color:var(--dim);font-size:clamp(13px,1.35vw,15px);}
#card .line.red{color:#d4634d;}
@keyframes lineIn{to{opacity:1;transform:none}}
#card .cbtns{margin-top:36px;display:flex;gap:14px;opacity:0;animation:lineIn 1s .2s ease forwards;}
#card .cbtn{
  background:none;border:1px solid rgba(232,224,210,.25);color:var(--paper);
  font-family:var(--sans);font-size:12px;letter-spacing:.26em;padding:13px 26px;cursor:pointer;transition:.3s;
}
#card .cbtn:hover{border-color:var(--red2);background:rgba(177,59,44,.12);color:#fff;}
#card .cbtn.primary{border-color:rgba(177,59,44,.6);color:#f4e2dc}
#card .cbtn.primary:hover{background:rgba(177,59,44,.26)}

/* ---------- 案卷 / 笔记本 ---------- */
#codex{
  position:fixed;inset:0;z-index:74;display:flex;align-items:center;justify-content:center;
  background:rgba(3,4,4,.9);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.4s;
}
#codex.on{opacity:1;pointer-events:auto}
.book{
  width:min(940px,92vw);height:min(660px,88vh);
  display:flex;flex-direction:column;
  background:
    linear-gradient(160deg,rgba(26,24,21,.97),rgba(12,12,12,.99)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 28px);
  border:1px solid rgba(232,224,210,.16);
  box-shadow:0 40px 120px rgba(0,0,0,.9),inset 0 0 80px rgba(0,0,0,.6);
  transform:translateY(12px);transition:.45s;
}
#codex.on .book{transform:none}
.book .bhead{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 14px;border-bottom:1px solid var(--line2);
}
.book .bhead .t{font-size:17px;letter-spacing:.34em;color:var(--paper);}
.book .bhead .t small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--dim2);margin-top:6px}
.book .bhead .x{background:none;border:1px solid var(--line);color:var(--dim);width:34px;height:34px;cursor:pointer;font-size:14px;transition:.25s}
.book .bhead .x:hover{color:#fff;border-color:var(--red)}
.tabs{display:flex;gap:0;padding:0 18px;border-bottom:1px solid var(--line2);}
.tab{
  background:none;border:0;border-bottom:1px solid transparent;color:var(--dim);
  font-family:var(--sans);font-size:12px;letter-spacing:.2em;padding:14px 16px;cursor:pointer;transition:.25s;
}
.tab:hover{color:var(--paper-2)}
.tab.on{color:#f2e6da;border-bottom-color:var(--red2)}
.tab .n{font-size:9px;color:var(--dim2);margin-left:5px}
.pages{flex:1;overflow:auto;padding:20px 26px 30px;position:relative;}
.pages::-webkit-scrollbar{width:5px}
.pages::-webkit-scrollbar-thumb{background:rgba(232,224,210,.18)}
.entry{border-bottom:1px solid var(--line2);padding:13px 0 15px;display:flex;gap:16px;}
.entry:last-child{border-bottom:0}
.entry .tag{
  flex:0 0 auto;margin-top:3px;font-family:var(--sans);font-size:9px;letter-spacing:.16em;
  color:var(--red2);border:1px solid rgba(177,59,44,.45);padding:3px 6px;height:18px;line-height:12px;
}
.entry .tag.black{color:var(--dim);border-color:var(--line)}
.entry h4{margin:0 0 6px;font-size:15px;font-weight:400;letter-spacing:.1em;color:#e9e0d2}
.entry p{margin:0;font-size:13.5px;line-height:1.95;color:#a9a094;letter-spacing:.03em}
.empty{color:var(--dim2);font-size:13px;letter-spacing:.12em;padding:20px 0;font-family:var(--sans)}
.maskbox{position:absolute;right:26px;top:16px;width:104px;opacity:.92;pointer-events:none}
.maskbox svg{width:100%;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.8))}
.maskbox .cap{font-family:var(--sans);font-size:9px;letter-spacing:.18em;color:var(--dim2);text-align:center;margin-top:6px}

/* ---------- 标题页 ---------- */
#title{
  position:fixed;inset:0;z-index:80;background:#030404;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#title .bg{position:absolute;inset:0;opacity:1}
#title .bg svg{width:100%;height:100%;display:block}
#title .veil{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 48%,rgba(3,4,4,.08) 0%,rgba(3,4,4,.5) 58%,#030404 90%);}
#title .inner{position:relative;text-align:center;padding:0 24px}
#title h1{
  margin:0;font-size:clamp(44px,7.6vw,96px);font-weight:400;letter-spacing:.34em;
  color:#e9e0d2;text-indent:.34em;
  text-shadow:0 0 60px rgba(224,87,63,.18),0 0 120px rgba(0,0,0,.9);
}
#title .sub{ margin:22px 0 0;font-size:clamp(13px,1.35vw,15px);letter-spacing:.5em;color:#b0a798;text-indent:.5em; }
#title .rule{width:62px;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:28px auto 0;opacity:.8}
#title .menu{margin-top:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
#title .mbtn{
  background:none;border:0;color:var(--dim);font-family:var(--sans);
  font-size:13.5px;letter-spacing:.34em;padding:14px 30px;cursor:pointer;transition:.35s;min-width:230px;color:#c6bdb0;
}
#title .mbtn:hover{color:#fff;letter-spacing:.4em}
#title .mbtn:hover:before,#title .mbtn:hover:after{opacity:1}
#title .mbtn:before,#title .mbtn:after{content:'—';color:var(--red);opacity:0;transition:.35s;margin:0 12px}
#title .mbtn.off{opacity:.28;cursor:default}
#title .mbtn.off:hover{letter-spacing:.34em;color:var(--dim)}
#title .endings{margin-top:34px;font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:var(--dim2);min-height:14px}
#title .endings b{color:var(--red2);font-weight:400}
#title .foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-family:var(--sans);font-size:9.5px;letter-spacing:.24em;color:#3f3c37}
#title .snd{position:absolute;top:22px;right:22px;z-index:2}

/* ---------- 结局 ---------- */
#card.ending .line{font-size:clamp(14px,1.6vw,18px)}
#card.ending .doc{font-family:var(--serif);border:1px solid var(--line);padding:26px 34px;max-width:640px;margin-top:8px;background:rgba(255,255,255,.012)}
#card.ending .doc p{margin:7px 0;font-size:clamp(13px,1.4vw,15.5px);line-height:1.95;color:#cdc4b6;letter-spacing:.05em}

/* ---------- 响应式 ---------- */
@media (max-width:820px){
  #top{height:46px;flex:0 0 46px;padding:0 14px;letter-spacing:.12em;font-size:10px}
  #top .left .scene{display:none}
  #dialog{min-height:clamp(168px,27vh,270px);padding:16px 22px 20px}
  #top .right .tbtn{font-size:10px;letter-spacing:.06em;padding:6px 7px}
  #top .left{gap:9px}
  #top .tbtn .badge{margin-left:4px}
  #txt{font-size:15px;line-height:1.95}
  #hint{right:18px;bottom:10px;font-size:9px}
  .hs b{display:none}
  .hs i{width:15px;height:15px}
  #chips{display:flex;}
  #chips{bottom:8px}
  #nav{padding:0 12px 12px;align-items:flex-end}
  #nav .navbtn{font-size:11px;padding:10px 13px;letter-spacing:.1em}

/* ---------------- 音效 ---------------- */

  var ctx = null, master = null, droneGain = null, muted = false;

    var b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);

    var g2 = ctx.createGain(); g2.gain.value = 0.5;
    o1.connect(g1); o2.connect(g2); g1.connect(lp); g2.connect(lp);
    lp.connect(droneGain); droneGain.connect(master);

    var lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.045;

    hiss.connect(bp); bp.connect(hg); hg.connect(master);

    muted = m;
    try { localStorage.setItem(MKEY, m ? '1' : '0'); } catch (e) {}

    g.gain.exponentialRampToValueAtTime(gain || 0.08, ctx.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);

  if (typing) { finishType(); return; }

  typeTimer = setInterval(function () {
    i += 1;
    el.textContent = text.slice(0, i);
    if (i >= text.length) finishType();

function finishType() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }

var curScene = null, spots = [], curNav = [];

function artHTML(inner) {
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice">' + svgDefs() + inner + '</svg>';
}

function renderSpots() {
  var layer = $('#spots'), chips = $('#chips');
  layer.innerHTML = ''; chips.innerHTML = '';
  spots.forEach(function (s) {
    if (s.when && !s.when()) return;
    var b = document.createElement('button');
    var done = s.done ? s.done() : (s.visit ? has(s.visit) : false);
    var lit = s.lit ? (typeof s.lit === 'function' ? s.lit() : s.lit) : false;
    b.className = 'hs' + (done ? ' done' : '') + (s.up ? ' up' : '') + (s.node ? ' node' : '') + (lit ? ' lit' : '');
    b.style.left = s.x + 'px';
    b.style.top = s.y + 'px';
    b.innerHTML = '<i></i><b>' + s.label + '</b>';
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (fading) return;
      SND.click();
      // 对话进行中：点任意热点都只是推进对白，避免打断并丢掉后续回调
      if (typing || lineQ.length) { nextLine(); return; }
      if (s.click) s.click();
    });
    layer.appendChild(b);

    var c = document.createElement('button');
    c.className = 'chip' + (done ? ' done' : '');
    c.textContent = s.label;
    c.addEventListener('click', function (e) {
      e.stopPropagation(); if (fading) return; SND.click();
      if (typing || lineQ.length) { nextLine(); return; }
      if (s.click) s.click();
    });
    chips.appendChild(c);
  });
}

function renderNav(items) {
  var nav = $('#nav');
  curNav = items || [];
  nav.innerHTML = '';
  curNav.forEach(function (n) {
    if (n.when && !n.when()) return;
    var b = document.createElement('button');
    b.className = 'navbtn' + (n.primary ? ' primary' : '');
    b.textContent = n.label;
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (fading) return;
      SND.click();
      if (n.fn) n.fn();
    });
    nav.appendChild(b);
  });
}

function refresh() {
  if (!curScene) return;
  spots = curScene.spots ? curScene.spots() : [];
  renderSpots();
  renderNav(curScene.nav ? curScene.nav() : []);
}

function go(id) {
  if (fading) return;
  var sc = SCENES[id];
  if (!sc) { console.warn('missing scene', id); return; }
  var first = S.seen.indexOf(id) < 0;
  if (first) S.seen.push(id);
  S.scene = id;
  save();

  fadeTo(function () {
    curScene = sc;
    $('#chapterLabel').textContent = sc.ch;
    $('#sceneLabel').textContent = sc.name;
    document.body.setAttribute('data-scene', id);
    $('#art').innerHTML = artHTML(sc.art());
    spots = sc.spots ? sc.spots() : [];
    renderSpots();
    renderNav(sc.nav ? sc.nav() : []);
    clearDialog();
    if (sc.enter) sc.enter(first);
    refresh();
  });
}

var fading = false;
function fadeTo(fn) {
  fading = true;
  var f = $('#fade');
  f.classList.add('on');
  setTimeout(function () {
    try { fn(); } catch (e) { console.error(e); }
    setTimeout(function () { f.classList.remove('on'); fading = false; }, 60);
  }, 480);
}

/* ---------------- 章节卡 ---------------- */
function showCard(opt) {
  var card = $('#card');
  card.className = 'on' + (opt.cls ? ' ' + opt.cls : '');
  var html = '';
  if (opt.kicker) html += '<div class="kicker">' + opt.kicker + '</div>';
  (opt.lines || []).forEach(function (l, i) {
    var cls = 'line' + (l.indexOf('!gray!') === 0 ? ' gray' : '');
    var txt = l.replace('!gray!', '');
    html += '<p class="' + cls + '" style="animation-delay:' + (0.35 + i * 0.72) + 's">' + txt + '</p>';
  });
  html += '<div class="cbtns" style="animation-delay:' + (0.6 + (opt.lines || []).length * 0.72) + 's"></div>';
  card.innerHTML = html;
  var wrap = $('.cbtns', card);
  (opt.buttons || [{ label: '继续' }]).forEach(function (b) {
    var el = document.createElement('button');
    el.className = 'cbtn' + (b.primary ? ' primary' : '');
    el.textContent = b.label;
    el.addEventListener('click', function () {
      SND.click();
      if (b.fn) b.fn();
    });
    wrap.appendChild(el);
  });
}

function hideCard() {
  $('#card').className = '';
  $('#card').innerHTML = '';
}

/* ---------------- 案卷 ---------------- */
var curTab = 'clues';

function openCodex(tab) {
  curTab = tab || curTab;
  S.opens += 1;
  save();
  paintCodex();
  $('#codex').classList.add('on');
}
function closeCodex() { $('#codex').classList.remove('on'); }

function paintCodex() {
  document.querySelectorAll('#codex .tab').forEach(function (t) {
    var on = t.getAttribute('data-tab') === curTab;
    t.classList.toggle('on', on);
    var k = t.getAttribute('data-tab');
    var n = k === 'clues' ? S.clues.length : k === 'items' ? S.items.length : k === 'ded' ? S.ded.length : S.notes.length;
    var badge = $('.n', t);
    if (badge) badge.textContent = n || '';
  });
  var p = $('#pages');
  p.innerHTML = '';
  var html = '';

  if (curTab === 'clues') {
    if (!S.clues.length) html = '<div class="empty">案卷是空的。先去现场。</div>';
    S.clues.forEach(function (id) {
      var c = CLUES[id];
      html += '<div class="entry"><div class="tag">线索</div><div><h4>' + c.n + '</h4><p>' + c.d + '</p></div></div>';
    });
  } else if (curTab === 'items') {
    if (!S.items.length) html = '<div class="empty">还没有从现场带走任何东西。</div>';
    S.items.forEach(function (id) {
      var c = ITEMS[id];
      html += '<div class="entry"><div class="tag">物证</div><div><h4>' + c.n + '</h4><p>' + c.d + '</p></div></div>';
    });
    if (S.items.indexOf('paperFace') >= 0) {
      html += '<div class="maskbox">' + maskSVG(S.opens) + '<div class="cap">证物 07 / 纸扎人脸</div></div>';
    }
  } else if (curTab === 'ded') {
    if (!S.ded.length) html = '<div class="empty">还没有形成推论。</div>';
    S.ded.forEach(function (id) {
      var d = DED[id];
      html += '<div class="entry"><div class="tag ' + (d.c === 'red' ? '' : 'black') + '">' + (d.c === 'red' ? '红注' : '推论') + '</div><div><p>' + d.t + '</p></div></div>';
    });
  } else {
    if (!S.notes.length) html = '<div class="empty">还没有红色批注。</div>';
    S.notes.forEach(function (n, i) {
      html += '<div class="entry"><div class="tag">批注</div><div><p>' + n + '</p></div></div>';
    });
  }
  p.innerHTML = html;
}

function buildCodex() {
  var tabs = [['clues', '线索'], ['items', '道具'], ['ded', '推论'], ['notes', '批注']];
  var box = $('#codex .tabs');
  box.innerHTML = '';
  tabs.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'tab'; b.setAttribute('data-tab', t[0]);
    b.innerHTML = t[1] + '<span class="n"></span>';
    b.addEventListener('click', function () { SND.click(); curTab = t[0]; paintCodex(); });
    box.appendChild(b);
  });
  document.querySelectorAll('#codex .tab').forEach(function (b) {
    var k = b.getAttribute('data-tab');
    var n = k === 'clues' ? S.clues.length : k === 'items' ? S.items.length : k === 'ded' ? S.ded.length : S.notes.length;
    $('.n', b).textContent = n || '';
  });
}

/* ---------------- 界面骨架 ---------------- */
function buildShell() {
  var app = document.createElement('div');
  app.id = 'app';
  app.innerHTML =
    '<div id="top">' +
      '<div class="left"><span class="no" id="chapterLabel">序章</span><span class="scene" id="sceneLabel"></span></div>' +
      '<div class="right">' +
        '<button class="tbtn" id="openCodex">案卷<span class="badge" id="badge">0</span></button>' +
        '<button class="tbtn" id="sound">音效 · 开</button>' +
      '</div>' +
    '</div>' +
    '<div id="stage">' +
      '<div id="world"><div id="art"></div><div id="spots"></div><div id="chips"></div><div id="nav"></div><div id="faceov"></div></div>' +
    '</div>' +
    '<div id="dialog">' +
      '<div id="who"></div><div id="txt"></div><div id="choices"></div>' +
      '<div id="hint">点击继续</div>' +
    '</div>';
  document.body.appendChild(app);

  var fx = document.createElement('div');
  fx.innerHTML = '<div id="fade"></div><div id="flash"></div><div id="grain"></div>' +
    '<div id="toasts"></div>' +
    '<div id="card"></div>' +
    '<div id="codex"><div class="book">' +
      '<div class="bhead"><div class="t">案 卷<small>CASE FILE · 内部资料</small></div><button class="x" id="closeCodex">✕</button></div>' +
      '<div class="tabs"></div><div class="pages" id="pages"></div>' +
    '</div></div>';
  while (fx.firstChild) document.body.appendChild(fx.firstChild);

  var vg = document.createElement('div');
  vg.id = 'vignette';
  document.getElementById('art').insertAdjacentElement('afterend', vg);

  document.body.setAttribute('data-san', '0');

  $('#dialog').addEventListener('click', advance);
  $('#openCodex').addEventListener('click', function (e) { e.stopPropagation(); SND.click(); buildCodex(); openCodex('clues'); });
  $('#closeCodex').addEventListener('click', function () { SND.click(); closeCodex(); });
  $('#codex').addEventListener('click', function (e) { if (e.target.id === 'codex') closeCodex(); });
  $('#sound').addEventListener('click', function (e) { e.stopPropagation(); SND.ensure(); SND.setMuted(!SND.muted()); });
  paintSound();

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeCodex();
    if (e.key === ' ' || e.key === 'Enter') {
      if ($('#codex').classList.contains('on')) return;
      if ($('#card').classList.contains('on')) return;
      e.preventDefault();
      advance();
    }
  });

  window.addEventListener('resize', layout);
  layout();
}

function layout() {
  var stage = $('#stage'), world = $('#world');
  if (!stage || !world) return;
  var w = stage.clientWidth, h = stage.clientHeight;
  var k = Math.min(w / W, h / H);
  var compact = w < 820;
  var y = compact ? Math.min(18, (h - H * k) / 2) : (h - H * k) / 2;
  world.style.transform = 'translate(' + ((w - W * k) / 2) + 'px,' + y + 'px) scale(' + k + ')';
  world.style.setProperty('--k', k);
}

/* ---------------- 标题页 ---------------- */
function showTitle() {
  document.body.insertAdjacentHTML('beforeend',
    '<div id="title">' +
      '<div class="bg" id="titleBg"></div><div class="veil"></div>' +
      '<div class="inner">' +
        '<h1>烟锁殡仪馆</h1>' +
        '<p class="sub">一桩没有干净人的案子</p>' +
        '<div class="rule"></div>' +
        '<div class="menu">' +
          '<button class="mbtn" id="mNew">开始勘查</button>' +
          '<button class="mbtn" id="mCont">继续案卷</button>' +
          '<button class="mbtn" id="mBook">线索笔记</button>' +
        '</div>' +
        '<div class="endings" id="endings"></div>' +
      '</div>' +
      '<div class="foot">第一人称 · 悬疑 · 微恐　|　点击场景中的异常处进行调查</div>' +
    '</div>');
  $('#titleBg').innerHTML = artHTML(artTitle());

  var sv = readSave();
  if (!sv || sv.scene === 'title') $('#mCont').classList.add('off');

  var ends = readings();
  if (ends.length) {
    $('#endings').innerHTML = '已达成结局　<b>' + ends.length + ' / 2</b>';
  }

  $('#mNew').addEventListener('click', function () {
    SND.ensure(); SND.thud();
    if (sv && sv.clues && sv.clues.length && !confirm('已有未结案的案卷，重新勘查会覆盖它。确定？')) return;
    S = fresh(); save();
    startGame(true);
  });
  $('#mCont').addEventListener('click', function () {
    if (!sv || sv.scene === 'title') return;
    SND.ensure();
    S = sv;
    document.body.setAttribute('data-san', String(S.san || 0));
    startGame(false);
  });
  $('#mBook').addEventListener('click', function () { SND.ensure(); SND.click(); buildCodex(); openCodex('clues'); });
  if (SND.muted()) paintSound();
}

function startGame(isNew) {
  var t = $('#title');
  t.style.transition = 'opacity .9s ease';
  t.style.opacity = '0';
  setTimeout(function () { t.style.display = 'none'; }, 900);
  SND.furnace();
  setTimeout(function () {
    if (isNew) { resetRun(); go('well'); }
    else { go(S.scene || 'well'); }
  }, 350);
}

function resetRun() {
  S.clues = []; S.items = []; S.ded = []; S.notes = []; S.flags = {}; S.seen = []; S.opens = 0; S.san = 0; S.ending = null;
  document.body.setAttribute('data-san', '0');
  paintBadge(); save();
}

/* ------- 密码锁 ------- */
var lockTries = 0;

function showLock() {
  var dates = ['01-13', '01-24', '02-14', '03-09', '03-12'];
  var target = [1, 3, 4];
  var sel = [0, 2, 0];
  var labels = ['井中死者失联日', '王希元失踪日', '短信发出日'];

  var d = document.createElement('div');
  d.id = 'lock';
  var html = '<div class="lockbox"><div class="lk">档案柜 · 密码锁</div><div class="lksub">三格日期，对上了，柜门才开</div>';
  for (var i = 0; i < 3; i++) {
    html += '<div class="lkrow" data-row="' + i + '">' +
      '<span class="lklab">' + labels[i] + '</span>' +
      '<button class="lkbtn prev">◀</button>' +
      '<span class="lkval">' + dates[sel[i]] + '</span>' +
      '<button class="lkbtn next">▶</button></div>';
  }
  html += '<div class="lkmsg" id="lkmsg"></div>' +
    '<div class="lkacts"><button class="lkopen">开 柜</button><button class="lkclose">退 开</button></div></div>';
  d.innerHTML = html;
  document.body.appendChild(d);
  requestAnimationFrame(function () { d.classList.add('on'); });

  d.addEventListener('click', function (e) { e.stopPropagation(); });

  d.querySelectorAll('.lkrow').forEach(function (row) {
    var i = +row.getAttribute('data-row');
    var val = row.querySelector('.lkval');
    function upd(delta) {
      sel[i] = (sel[i] + delta + dates.length) % dates.length;
      val.textContent = dates[sel[i]];
      SND.click();
    }
    row.querySelector('.prev').addEventListener('click', function () { upd(-1); });
    row.querySelector('.next').addEventListener('click', function () { upd(1); });
  });

  d.querySelector('.lkclose').addEventListener('click', function () { SND.click(); close(); });
  d.querySelector('.lkopen').addEventListener('click', function () {
    SND.click();
    if (sel[0] === target[0] && sel[1] === target[1] && sel[2] === target[2]) {
      SND.thud();
      close();
      setTimeout(openCabinet, 420);
    } else {
      lockTries += 1;
      var m = $('#lkmsg');
      m.textContent = lockTries >= 2 ? '柜门纹丝不动。案卷里记着三个日期。' : '柜门纹丝不动。';
      SND.thud();
    }
  });

  function close() {
    d.classList.remove('on');
    setTimeout(function () { d.remove(); }, 350);
  }
}

function openCabinet() {
  say([
    '（柜门弹开。里面是一沓火化登记表。）',
    '登记表上有一个名字被涂改过。底下隐约是“王希元”。',
    '火化日期：三月九日。经办人：张本岭。',
    '但王希元的“躲债短信”，是三月十二日发出来的。',
